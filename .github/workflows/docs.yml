name: Deploy Documentation

on:
  push:
    branches:
      - '18.0'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Zensical & Dependencies
        run: |
          pip install zensical mkdocs-material ghp-import

      - name: Build Documentation (Zensical Engine)
        run: |
          zensical build --clean || mkdocs build

      - name: Deploy to GitHub Pages (gh-pages)
        run: |
          ghp-import -p -f -n -m "deploy: update docs site with Zensical [skip ci]" site
