name: CI / Test Suite

on:
  push:
    branches: [ "18.0", "main", "master" ]
  pull_request:
    branches: [ "18.0", "main", "master" ]

jobs:
  lint:
    name: Code Linting & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Syntax Check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

  test:
    name: Odoo 18 Automated Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Moneta Unit Tests in Docker
        run: |
          set -o pipefail
          # GitHub Actions only blocks on service health when the job runs in a
          # container; since these steps run on the host runner, wait for postgres
          # ourselves before starting Odoo.
          for i in $(seq 1 30); do
            if docker run --rm --network host postgres:15 \
              pg_isready -h 127.0.0.1 -p 5432 -U odoo -d test_db >/dev/null 2>&1; then
              break
            fi
            echo "waiting for postgres to be ready... ($i)"
            sleep 2
          done
          # NOTE: no `|| true` here — a failing test suite must fail the build.
          # The repo root IS the module, so we mount it at a fixed
          # /mnt/extra-addons/moneta_finance path and point addons_path at the
          # parent so Odoo discovers it by name regardless of the repo name.
          docker run --rm --network host \
            -v "$PWD:/mnt/extra-addons/moneta_finance" \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            odoo:18.0 odoo \
              --addons-path=/mnt/extra-addons \
              -d test_db \
              -i moneta_finance \
              --test-enable \
              --test-tags=/moneta_finance \
              --stop-after-init \
              --log-level=info \
            2>&1 | tee /tmp/odoo-test.log

      - name: Upload Odoo Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log
          path: /tmp/odoo-test.log