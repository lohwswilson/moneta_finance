name: CI / Test Suite

on:
  push:
    branches: [ "18.0", "main", "master" ]
  pull_request:
    branches: [ "18.0", "main", "master" ]

jobs:
  lint:
    name: Code Linting & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Syntax Check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

  test:
    name: Odoo 18 Automated Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Moneta Unit Tests in Docker
        run: |
          docker run --rm -v $(pwd):/mnt/extra-addons/moneta_finance odoo:18.0 odoo             --addons-path=/mnt/extra-addons             --test-enable             --test-tags=moneta_finance             --stop-after-init             -d test_db || true
