site_name: Moneta Personal Finance
site_description: An Open-Source Personal Finance, Banking & Wealth Management Suite
site_author: Wilson Loh
site_url: https://lohwswilson.github.io/moneta_finance/
repo_url: https://github.com/lohwswilson/moneta_finance
repo_name: lohwswilson/moneta_finance
edit_uri: edit/18.0/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Light Mode
    - scheme: default
      primary: light blue
      accent: royal blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - scheme: slate
      primary: light blue
      accent: royal blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - header.autohide

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get Started: 01_GETTING_STARTED.md
  - User Guides:
      - Banking & Checkbook Registers: 02_BANKING_AND_RECONCILIATION.md
      - Stock Portfolio & Investments: 03_STOCKS_AND_INVESTMENTS.md
      - Budgets & Scheduled Bills: 04_BUDGETS_BILLS_AND_SUBSCRIPTIONS.md
      - Real Estate & Mortgages: 05_REAL_ESTATE_AND_AMORTIZATION.md
      - FIRE & Wealth Simulator: 06_FIRE_AND_SIMULATION.md
      - Security & Household Privacy: 07_SECURITY_AND_MULTI_USER.md
  - Regional Packs:
      - Singapore & SEA (CPF / SRS): 09_SINGAPORE_AND_SEA_WEALTH.md
      - Malaysia (EPF / LHDN): 10_MALAYSIA_WEALTH_AND_TAX.md
  - Developer Guide:
      - Architecture & MCP Server: 08_DEVELOPER_AND_API.md
      - Odoo Port Architecture: odoo-port.md
  - Roadmap: roadmap.md
  - Blog:
      - Blog Overview: blog/index.md
      - Introducing Moneta Personal Finance: blog/posts/2026-08-22-introducing-moneta-finance.md
      - Stochastic FIRE & Monte Carlo Modeling: blog/posts/2026-08-22-stochastic-fire-monte-carlo.md
      - Two-Legged Cross-Currency Transfers: blog/posts/2026-08-22-cross-currency-multi-ledger.md
